name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mymandado
          MYSQL_USER: admin
          MYSQL_PASSWORD: admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: |
          dotnet restore webapi/api-mandado.csproj
          dotnet restore tests/tests-mandado.csproj

      - name: Lint (dotnet format, non bloquant)
        continue-on-error: true
        run: |
          dotnet format webapi/api-mandado.csproj --verify-no-changes --no-restore
          dotnet format tests/tests-mandado.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build webapi/api-mandado.csproj --no-restore -c Release

      - name: Wait for MySQL
        env:
          MYSQL_PWD: admin
        run: |
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -u admin -e "SELECT 1" && exit 0
            sleep 2
          done
          echo "MySQL not ready" && exit 1

      - name: Apply migrations
        env:
          MYSQL_PWD: admin
        run: |
          for f in $(ls db/migrations/*.sql | sort); do
            echo "Applying $f"
            mysql -h 127.0.0.1 -u admin < "$f"
          done

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: "server=127.0.0.1;port=3306;database=mymandado;user=admin;password=admin;"
          JwtSettings__SecretKey: "ci-only-secret-key-0123456789abcdef0123456789"
        run: dotnet test tests/tests-mandado.csproj --no-restore -c Release
